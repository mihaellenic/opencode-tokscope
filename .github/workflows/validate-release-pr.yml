name: Validate release PR
run-name: 'Validate release PR #${{ inputs.pr }} request ${{ inputs.request_id }}'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Release PR number
        required: true
        type: string
      head_sha:
        description: Exact release PR head commit SHA
        required: true
        type: string
      request_id:
        description: Correlation token from the dispatching release run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: validate-release-pr-${{ inputs.pr }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      acceptance: ${{ steps.evidence.outputs.acceptance || 'not-run' }}
      artifact: ${{ steps.evidence.outputs.artifact || 'unavailable' }}
      audit: ${{ steps.evidence.outputs.audit || 'unavailable' }}
    steps:
      - name: Validate PR identity through the GitHub API
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REQUEST_ID: ${{ inputs.request_id }}
        run: |
          set -euo pipefail
          case "$REQUEST_ID" in
            ""|*[!0-9-]*) echo "request_id must contain only digits and hyphens" >&2; exit 1 ;;
          esac
          case "$PR" in
            ""|*[!0-9]*) echo "pr must be numeric" >&2; exit 1 ;;
          esac
          case "$HEAD_SHA" in
            ""|*[!0-9a-fA-F]*) echo "head_sha must be hexadecimal" >&2; exit 1 ;;
          esac
          if [ "${#HEAD_SHA}" -ne 40 ]; then
            echo "head_sha must be a full 40-character SHA" >&2
            exit 1
          fi
          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          actual_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')
          state=$(printf '%s' "$pr_json" | jq -r '.state // empty')
          base_ref=$(printf '%s' "$pr_json" | jq -r '.base.ref // empty')
          base_sha=$(printf '%s' "$pr_json" | jq -r '.base.sha // empty')
          head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // empty')
          head_ref=$(printf '%s' "$pr_json" | jq -r '.head.ref // empty')
          test "$actual_sha" = "$HEAD_SHA"
          test "$state" = "open"
          test "$base_ref" = "main"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          case "$head_ref" in
            release-please--*) ;;
            *) echo "release PR head branch is not a release-please branch" >&2; exit 1 ;;
          esac
          case "$base_sha" in
            ""|*[!0-9a-fA-F]*) echo "base SHA is unavailable or malformed" >&2; exit 1 ;;
          esac
          if [ "${#base_sha}" -ne 40 ]; then
            echo "base SHA must be a full 40-character SHA" >&2
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 0

      - name: Verify the checked-out commit
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Ensure the PR base commit is available
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${BASE_SHA}^{commit}"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm for release acceptance
        run: |
          set -euo pipefail
          npm install -g npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.3

      - id: install
        run: bun install --frozen-lockfile
      - id: typecheck
        run: bun run typecheck
      - id: test
        run: bun test
      - id: build
        run: bun run build

      - name: Validate release PR commit subjects
        id: subjects
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          subjects=$(git log --format='%s' "$BASE_SHA..$HEAD_SHA")
          if [ -z "$subjects" ]; then
            echo "no commits in release PR range"
            exit 0
          fi
          while IFS= read -r s; do
            echo "checking: $s"
            sh scripts/commit-subject-ok.sh "$s"
          done <<< "$subjects"

      - name: Accept the exact release PR artifact
        id: accept
        env:
          SCRATCH_ROOT: ${{ runner.temp }}
          ARTIFACT_DIR: ${{ runner.temp }}/tokscope-release-pr
        run: bun scripts/release-acceptance.ts --output-dir "$ARTIFACT_DIR"

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-pr-evidence-${{ inputs.pr }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tokscope-release-pr
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize validation and acceptance evidence
        id: evidence
        if: always()
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          ACCEPTANCE: ${{ steps.accept.outcome || 'not-run' }}
          INSTALL: ${{ steps.install.outcome || 'not-run' }}
          TYPECHECK: ${{ steps.typecheck.outcome || 'not-run' }}
          TEST: ${{ steps.test.outcome || 'not-run' }}
          BUILD: ${{ steps.build.outcome || 'not-run' }}
          SUBJECTS: ${{ steps.subjects.outcome || 'not-run' }}
          ARTIFACT_DIR: ${{ runner.temp }}/tokscope-release-pr
          EVIDENCE_ARTIFACT: release-pr-evidence-${{ inputs.pr }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          artifact=not-produced
          artifact_detail="no accepted artifact was preserved"
          audit=not-run
          audit_detail="the consumer audit did not run"

          if [ -f "$ARTIFACT_DIR/artifact.json" ]; then
            if jq -e '(.name | type) == "string" and (.version | type) == "string" and (.filename | type) == "string" and (.integrity | type) == "string"' \
              "$ARTIFACT_DIR/artifact.json" >/dev/null 2>&1; then
              identity=$(jq -r '.name + "@" + .version + " (" + .filename + ")"' "$ARTIFACT_DIR/artifact.json")
              artifact=accepted
              artifact_detail="accepted $identity"
            else
              artifact=unreadable
              artifact_detail="artifact.json is incomplete or unreadable"
            fi
          fi

          if [ -f "$ARTIFACT_DIR/accepted-audit-exceptions.json" ]; then
            audit=exception-applied
            audit_detail="scoped audit exception applied — NOT a clean audit; see accepted-audit-exceptions.json"
          elif [ -f "$ARTIFACT_DIR/npm-audit-omit-dev.json" ]; then
            if jq -e '(.metadata.vulnerabilities.high | type) == "number" and (.metadata.vulnerabilities.critical | type) == "number"' \
              "$ARTIFACT_DIR/npm-audit-omit-dev.json" >/dev/null 2>&1; then
              high=$(jq -r '.metadata.vulnerabilities.high' "$ARTIFACT_DIR/npm-audit-omit-dev.json")
              critical=$(jq -r '.metadata.vulnerabilities.critical' "$ARTIFACT_DIR/npm-audit-omit-dev.json")
              if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then
                audit=blocking
                audit_detail="blocking high=$high critical=$critical advisories in the raw consumer audit"
              elif [ "$ACCEPTANCE" = "success" ]; then
                audit=no-high-critical
                audit_detail="no high/critical advisories in the raw consumer audit"
              else
                audit=unverified
                audit_detail="raw consumer audit present but not confirmed by a successful acceptance"
              fi
            else
              audit=unusable
              audit_detail="the raw consumer audit report is unusable"
            fi
          fi

          {
            echo "acceptance=$ACCEPTANCE"
            echo "artifact=$artifact"
            echo "audit=$audit"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release PR validation"
            echo ""
            echo "Prerequisites for head \`$HEAD_SHA\`: install=$INSTALL typecheck=$TYPECHECK test=$TEST build=$BUILD subjects=$SUBJECTS"
            echo ""
            echo "Artifact acceptance (preflight, registry guard, pack, consumer audit): **$ACCEPTANCE**"
            echo ""
            echo "- Artifact: $artifact_detail"
            echo "- Audit: $audit_detail"
            echo "- Evidence artifact: \`$EVIDENCE_ARTIFACT\`"
            echo ""
            echo "Acceptance covers the artifact only; it does not verify publication."
            if [ "$audit" = "exception-applied" ]; then
              echo ""
              echo "**Audit exception applied — this is NOT a clean audit.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: read
    steps:
      - name: Publish the validation check on the release PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr }}
          HEAD_SHA: ${{ inputs.head_sha }}
          RESULT: ${{ needs.validate.result }}
          ACCEPTANCE: ${{ needs.validate.outputs.acceptance }}
          ARTIFACT: ${{ needs.validate.outputs.artifact }}
          AUDIT: ${{ needs.validate.outputs.audit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVIDENCE_ARTIFACT: release-pr-evidence-${{ inputs.pr }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          conclusion=failure
          if [ "$RESULT" = "success" ] && [ "$ACCEPTANCE" = "success" ] && [ "$ARTIFACT" = "accepted" ]; then
            case "$AUDIT" in
              exception-applied|no-high-critical) conclusion=success ;;
            esac
          fi
          title="Release PR validation failed ($ACCEPTANCE)"
          case "$ACCEPTANCE" in
            success)
              if [ "$conclusion" = "success" ]; then
                title="Release PR validation passed"
              else
                title="Release PR validation failed after artifact acceptance"
              fi
              ;;
            skipped|not-run)
              title="Release PR validation failed before artifact acceptance"
              ;;
            failure)
              case "$AUDIT" in
                blocking) title="Release PR artifact audit failed" ;;
                unusable) title="Release PR artifact audit could not be evaluated" ;;
                *) title="Release PR artifact acceptance failed" ;;
              esac
              ;;
          esac
          case "$ARTIFACT" in
            accepted) artifact_status="accepted artifact preserved as evidence" ;;
            not-produced) artifact_status="no accepted artifact was preserved" ;;
            *) artifact_status="artifact status unavailable" ;;
          esac
          case "$AUDIT" in
            exception-applied) audit_status="scoped audit exception applied; NOT a clean audit (see accepted-audit-exceptions.json)" ;;
            no-high-critical) audit_status="raw consumer audit reported no high/critical advisories" ;;
            blocking) audit_status="blocking high/critical advisories reported" ;;
            unusable) audit_status="raw consumer audit report absent or unusable" ;;
            unverified) audit_status="raw consumer audit report present but not confirmed by acceptance" ;;
            *) audit_status="consumer audit did not run" ;;
          esac
          if [ "$conclusion" = "success" ]; then
            outcome_line="Artifact accepted for publication. This check does not verify publication."
          else
            outcome_line="Validation did not pass. Acceptance covers the artifact only; it does not verify publication."
          fi
          summary=$(printf '%s\n' \
            "Release PR validation result: $RESULT" \
            "" \
            "- Artifact acceptance: $ACCEPTANCE" \
            "- Artifact: $artifact_status" \
            "- Audit: $audit_status" \
            "- Evidence artifact: $EVIDENCE_ARTIFACT" \
            "" \
            "Dispatched validation run: $RUN_URL" \
            "$outcome_line")
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.head.sha // empty')
          if [ "$actual_sha" != "$HEAD_SHA" ]; then
            echo "release PR head moved from $HEAD_SHA to ${actual_sha:-<unavailable>}; refusing to publish a stale validation check" >&2
            exit 1
          fi
          jq -n \
            --arg sha "$HEAD_SHA" \
            --arg conclusion "$conclusion" \
            --arg title "$title" \
            --arg summary "$summary" \
            --arg details_url "$RUN_URL" \
            '{name: "release-pr-validation", head_sha: $sha, status: "completed", conclusion: $conclusion, details_url: $details_url, output: {title: $title, summary: $summary}}' \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/check-runs" --input -
