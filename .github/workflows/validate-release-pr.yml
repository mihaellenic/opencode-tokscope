name: Validate release PR
run-name: 'Validate release PR #${{ github.event.pull_request.number }}'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: validate-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: release-pr-validation
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release-please--')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate PR identity through the GitHub API
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_HEAD_REPO: controlled-negative/identity-mismatch
          EVENT_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          case "$PR" in
            ""|*[!0-9]*) echo "pr must be numeric" >&2; exit 1 ;;
          esac
          case "$HEAD_SHA" in
            ""|*[!0-9a-fA-F]*) echo "event head SHA must be hexadecimal" >&2; exit 1 ;;
          esac
          if [ "${#HEAD_SHA}" -ne 40 ]; then
            echo "event head SHA must be a full 40-character SHA" >&2
            exit 1
          fi
          for event_value in "$EVENT_HEAD_REPO" "$EVENT_HEAD_REF" "$EVENT_BASE_REF" "$GITHUB_REPOSITORY"; do
            if [ -z "$event_value" ]; then
              echo "event identity is incomplete" >&2
              exit 1
            fi
          done
          pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          actual_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha // empty')
          state=$(printf '%s' "$pr_json" | jq -r '.state // empty')
          base_ref=$(printf '%s' "$pr_json" | jq -r '.base.ref // empty')
          base_sha=$(printf '%s' "$pr_json" | jq -r '.base.sha // empty')
          head_repo=$(printf '%s' "$pr_json" | jq -r '.head.repo.full_name // empty')
          head_ref=$(printf '%s' "$pr_json" | jq -r '.head.ref // empty')
          test "$actual_sha" = "$HEAD_SHA"
          test "$state" = "open"
          test "$base_ref" = "main"
          test "$base_ref" = "$EVENT_BASE_REF"
          test "$head_repo" = "$GITHUB_REPOSITORY"
          test "$head_repo" = "$EVENT_HEAD_REPO"
          test "$head_ref" = "$EVENT_HEAD_REF"
          case "$head_ref" in
            release-please--*) ;;
            *) echo "release PR head branch is not a release-please branch" >&2; exit 1 ;;
          esac
          case "$base_sha" in
            ""|*[!0-9a-fA-F]*) echo "base SHA is unavailable or malformed" >&2; exit 1 ;;
          esac
          if [ "${#base_sha}" -ne 40 ]; then
            echo "base SHA must be a full 40-character SHA" >&2
            exit 1
          fi
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the checked-out commit
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"

      - name: Ensure the PR base commit is available
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git cat-file -e "${BASE_SHA}^{commit}"

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Pin npm for release acceptance
        run: |
          set -euo pipefail
          npm install -g npm@11.16.0
          test "$(npm --version)" = "11.16.0"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.3

      - id: install
        run: bun install --frozen-lockfile
      - id: typecheck
        run: bun run typecheck
      - id: test
        run: bun test
      - id: build
        run: bun run build

      - name: Validate release PR commit subjects
        id: subjects
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          subjects=$(git log --format='%s' "$BASE_SHA..$HEAD_SHA")
          if [ -z "$subjects" ]; then
            echo "no commits in release PR range"
            exit 0
          fi
          while IFS= read -r s; do
            echo "checking: $s"
            sh scripts/commit-subject-ok.sh "$s"
          done <<< "$subjects"

      - name: Accept the exact release PR artifact
        id: accept
        env:
          SCRATCH_ROOT: ${{ runner.temp }}
          ARTIFACT_DIR: ${{ runner.temp }}/tokscope-release-pr
        run: bun scripts/release-acceptance.ts --output-dir "$ARTIFACT_DIR"

      - name: Verify current PR head
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACT_DIR: ${{ runner.temp }}/tokscope-release-pr
        run: |
          set -euo pipefail
          expected_sha="$HEAD_SHA"
          observed_sha=""
          pr_state=""
          outcome=unverified
          mkdir -p "$ARTIFACT_DIR"
          if pr_json=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR"); then
            if printf '%s' "$pr_json" | jq -e '
              type == "object"
              and (.head | type) == "object"
              and (.head.sha | type) == "string"
              and (.state | type) == "string"
            ' >/dev/null 2>&1; then
              observed_sha=$(printf '%s' "$pr_json" | jq -r '.head.sha')
              pr_state=$(printf '%s' "$pr_json" | jq -r '.state')
              case "$observed_sha" in
                ""|*[!0-9a-fA-F]*) ;;
                *)
                  if [ "${#observed_sha}" -eq 40 ]; then
                    case "$pr_state" in
                      closed) outcome=closed ;;
                      open)
                        if [ "$observed_sha" = "$expected_sha" ]; then
                          outcome=current
                        else
                          outcome=stale
                        fi
                        ;;
                    esac
                  fi
                  ;;
              esac
            fi
          fi
          jq -n \
            --arg expected_sha "$expected_sha" \
            --arg observed_sha "$observed_sha" \
            --arg pr_state "$pr_state" \
            --arg outcome "$outcome" \
            '{expected_sha: $expected_sha, observed_sha: (if $observed_sha == "" then null else $observed_sha end), pr_state: (if $pr_state == "" then null else $pr_state end), outcome: $outcome}' \
            > "$ARTIFACT_DIR/head-status.json"
          if [ "$outcome" != "current" ]; then
            echo "release PR head is not current ($outcome): expected $expected_sha, observed ${observed_sha:-<unavailable>}" >&2
            exit 1
          fi

      - name: Preserve acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-pr-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/tokscope-release-pr
          if-no-files-found: warn
          retention-days: 14

      - name: Summarize validation and acceptance evidence
        id: evidence
        if: always()
        env:
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ACCEPTANCE: ${{ steps.accept.outcome || 'not-run' }}
          INSTALL: ${{ steps.install.outcome || 'not-run' }}
          TYPECHECK: ${{ steps.typecheck.outcome || 'not-run' }}
          TEST: ${{ steps.test.outcome || 'not-run' }}
          BUILD: ${{ steps.build.outcome || 'not-run' }}
          SUBJECTS: ${{ steps.subjects.outcome || 'not-run' }}
          FRESHNESS: ${{ steps.freshness.outcome || 'not-run' }}
          ARTIFACT_DIR: ${{ runner.temp }}/tokscope-release-pr
          EVIDENCE_ARTIFACT: release-pr-evidence-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          acceptance=${ACCEPTANCE:-not-run}
          freshness=${FRESHNESS:-not-run}
          artifact=not-produced
          artifact_detail="no accepted artifact was preserved"
          audit=not-run
          audit_detail="the consumer audit did not run"
          head_outcome=not-run
          head_detail="the live PR head check did not run because an earlier step failed"

          if [ -f "$ARTIFACT_DIR/artifact.json" ]; then
            if jq -e '(.name | type) == "string" and (.version | type) == "string" and (.filename | type) == "string" and (.integrity | type) == "string"' \
              "$ARTIFACT_DIR/artifact.json" >/dev/null 2>&1; then
              identity=$(jq -r '.name + "@" + .version + " (" + .filename + ")"' "$ARTIFACT_DIR/artifact.json")
              artifact=accepted
              artifact_detail="accepted $identity"
            else
              artifact=unreadable
              artifact_detail="artifact.json is incomplete or unreadable"
            fi
          fi

          if [ -f "$ARTIFACT_DIR/accepted-audit-exceptions.json" ]; then
            audit=exception-applied
            audit_detail="scoped audit exception applied — NOT a clean audit; see accepted-audit-exceptions.json"
          elif [ -f "$ARTIFACT_DIR/npm-audit-omit-dev.json" ]; then
            if jq -e '(.metadata.vulnerabilities.high | type) == "number" and (.metadata.vulnerabilities.critical | type) == "number"' \
              "$ARTIFACT_DIR/npm-audit-omit-dev.json" >/dev/null 2>&1; then
              high=$(jq -r '.metadata.vulnerabilities.high' "$ARTIFACT_DIR/npm-audit-omit-dev.json")
              critical=$(jq -r '.metadata.vulnerabilities.critical' "$ARTIFACT_DIR/npm-audit-omit-dev.json")
              if [ "$high" -gt 0 ] || [ "$critical" -gt 0 ]; then
                audit=blocking
                audit_detail="blocking high=$high critical=$critical advisories in the raw consumer audit"
              elif [ "$acceptance" = "success" ]; then
                audit=no-high-critical
                audit_detail="no high/critical advisories in the raw consumer audit"
              else
                audit=unverified
                audit_detail="raw consumer audit present but not confirmed by a successful acceptance"
              fi
            else
              audit=unusable
              audit_detail="the raw consumer audit report is unusable"
            fi
          fi

          if [ -f "$ARTIFACT_DIR/head-status.json" ]; then
            recorded_outcome=$(jq -r '.outcome // "unverified"' "$ARTIFACT_DIR/head-status.json")
            expected_sha=$(jq -r '.expected_sha // empty' "$ARTIFACT_DIR/head-status.json")
            observed_sha=$(jq -r '.observed_sha // empty' "$ARTIFACT_DIR/head-status.json")
            pr_state=$(jq -r '.pr_state // empty' "$ARTIFACT_DIR/head-status.json")
            case "$recorded_outcome" in
              current)
                if [ "$freshness" = "success" ]; then
                  head_outcome=current
                  head_detail="PR #$PR is open at the validated head"
                else
                  head_outcome=unverified
                  head_detail="a current snapshot exists but the freshness step did not succeed"
                fi
                ;;
              stale)
                head_outcome=stale
                head_detail="PR #$PR head moved from $expected_sha to ${observed_sha:-<unavailable>}; this validation is stale"
                ;;
              closed)
                head_outcome=closed
                head_detail="PR #$PR is ${pr_state:-closed}; the validated head is no longer current"
                ;;
              *)
                head_outcome=unverified
                head_detail="the live PR head could not be verified (state: ${pr_state:-unavailable})"
                ;;
            esac
          fi

          {
            echo "acceptance=$acceptance"
            echo "artifact=$artifact"
            echo "audit=$audit"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Release PR validation"
            echo ""
            echo "Prerequisites for head \`$HEAD_SHA\`: install=$INSTALL typecheck=$TYPECHECK test=$TEST build=$BUILD subjects=$SUBJECTS"
            echo ""
            echo "Artifact acceptance (preflight, registry guard, pack, consumer audit): **$acceptance**"
            echo ""
            echo "- Artifact: $artifact_detail"
            echo "- Audit: $audit_detail"
            echo "- Head freshness: **$head_outcome** — $head_detail"
            echo "- Evidence artifact: \`$EVIDENCE_ARTIFACT\`"
            echo ""
            echo "Acceptance covers the artifact only; it does not verify publication."
            if [ "$audit" = "exception-applied" ]; then
              echo ""
              echo "**Audit exception applied — this is NOT a clean audit.**"
            fi
            if [ "$head_outcome" = "not-run" ]; then
              echo ""
              echo "**Head freshness is not-run: do not treat this run as a successful validation.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require accepted evidence
        env:
          ACCEPTANCE: ${{ steps.evidence.outputs.acceptance || 'not-run' }}
          ARTIFACT: ${{ steps.evidence.outputs.artifact || 'unavailable' }}
          AUDIT: ${{ steps.evidence.outputs.audit || 'unverified' }}
          FRESHNESS: ${{ steps.freshness.outcome || 'not-run' }}
        run: |
          set -euo pipefail
          acceptance=${ACCEPTANCE:-not-run}
          artifact=${ARTIFACT:-unavailable}
          audit=${AUDIT:-unverified}
          freshness=${FRESHNESS:-not-run}
          if [ "$acceptance" != "success" ]; then
            echo "artifact acceptance did not succeed: $acceptance" >&2
            exit 1
          fi
          if [ "$artifact" != "accepted" ]; then
            echo "no accepted artifact evidence: $artifact" >&2
            exit 1
          fi
          case "$audit" in
            exception-applied|no-high-critical) ;;
            *) echo "consumer audit is not acceptable: $audit" >&2; exit 1 ;;
          esac
          if [ "$freshness" != "success" ]; then
            echo "current PR head was not verified: $freshness" >&2
            exit 1
          fi
